<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart Admin Login</title>

    <link rel="stylesheet" href="/src/admin.css">
</head>

<body>

    <div class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-login-logo">
                🛒
            </div>

            <h1>FreshCart</h1>

            <p class="admin-login-subtitle">
                Admin Dashboard
            </p>

            <form id="adminLoginForm">

                <div class="admin-login-field">
                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="admin-login-field">
                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="admin-login-button"
                >
                    Login
                </button>

                <p
                    id="adminLoginMessage"
                    class="admin-login-message"
                ></p>

            </form>

            <a href="/" class="back-to-store">
                ← Back to Store
            </a>

        </div>

    </div>

    <script type="module" src="./src/admin-login.js"></script>

</body>
</html>
