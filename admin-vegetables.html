<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Manage Vegetables</title>

    <link rel="stylesheet" href="/src/admin.css">
</head>

<body>

    <!-- HEADER -->
    <header class="admin-header">

        <div>
            <h1>🥕 Vegetables Management</h1>
            <p>Manage vegetables, prices, variants and availability</p>
        </div>

        <div class="admin-header-actions">

            <a
                href="/admin.html"
                class="back-button"
            >
                ← Dashboard
            </a>

            <button
                id="addVegetableButton"
                class="add-product-button"
            >
                + Add Vegetable
            </button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="admin-container">

        <!-- TOOLBAR -->
        <section class="product-management-toolbar">

            <div>
                <h2>All Vegetables</h2>

                <p>
                    Products available in the vegetables category
                </p>
            </div>

            <div class="product-search">

                <input
                    type="text"
                    id="vegetableSearch"
                    placeholder="Search vegetables..."
                >

            </div>

        </section>


        <!-- VEGETABLE LIST -->
        <section class="products-management-section">

            <div
                id="vegetablesList"
                class="products-management-list"
            >

                <div class="products-loading">
                    Loading vegetables...
                </div>

            </div>

        </section>

    </main>


    <!-- EDIT PRODUCT MODAL -->

    <div
        id="productEditModal"
        class="product-edit-modal"
    >

        <div class="product-edit-overlay"></div>


        <div class="product-edit-container">

            <!-- MODAL HEADER -->

            <div class="product-edit-header">

                <div>

                    <h2>Edit Vegetable</h2>

                    <p>
                        Update product information
                    </p>

                </div>


                <button
                    type="button"
                    id="closeProductEdit"
                    class="product-edit-close"
                >
                    ×
                </button>

            </div>


            <!-- FORM -->

            <form id="productEditForm">

                <!-- PRODUCT ID -->

                <input
                    type="hidden"
                    id="editProductId"
                >


                <!-- NAME -->

                <div class="product-edit-field">

                    <label for="editProductName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="editProductName"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="product-edit-field">

                    <label for="editProductDescription">
                        Description
                    </label>

                    <textarea
                        id="editProductDescription"
                        rows="4"
                    ></textarea>

                </div>


                <!-- ORIGIN -->

                <div class="product-edit-field">

                    <label for="editProductOrigin">
                        Origin
                    </label>

                    <input
                        type="text"
                        id="editProductOrigin"
                    >

                </div>


                <!-- IMAGE -->

                <div class="product-edit-field">

                    <label for="editProductImage">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="editProductImage"
                        placeholder="https://..."
                    >

                </div>


                <!-- VARIANTS -->

                <div class="product-edit-field">

                    <label>
                        Variants & Prices
                    </label>


                    <div
                        id="editVariantsList"
                        class="edit-variants-list"
                    >
                        <!-- Variants loaded dynamically -->
                    </div>


                    <button
                        type="button"
                        id="addVariantButton"
                        class="add-variant-button"
                    >
                        + Add Variant
                    </button>

                </div>


                <!-- STOCK MANAGEMENT -->

                <div class="product-edit-field">

                    <label>Stock Management</label>

                    <div class="stock-edit-grid">

                        <div class="stock-edit-input">
                            <label for="editProductStock">Stock Quantity</label>
                            <input type="number" id="editProductStock" min="0" step="1" placeholder="Enter quantity" required>
                        </div>

                        <div class="stock-edit-input">
                            <label for="editProductStockUnit">Stock Unit</label>
                            <select id="editProductStockUnit">
                                <option value="kg">kg</option>
                                <option value="g">g</option>
                                <option value="pcs">pcs</option>
                                <option value="bunch">bunch</option>
                                <option value="box">box</option>
                                <option value="dozen">dozen</option>
                            </select>
                        </div>

                        <div class="stock-edit-input">
                            <label for="editLowStockThreshold">Low Stock Alert</label>
                            <input type="number" id="editLowStockThreshold" min="0" step="1" placeholder="5" required>
                        </div>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="product-edit-actions">

                    <button
                        type="button"
                        id="cancelProductEdit"
                        class="product-cancel-button"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        id="saveProductButton"
                        class="product-save-button"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>
    <!-- ADD VEGETABLE MODAL -->

<div
    id="productAddModal"
    class="product-edit-modal"
>

    <div class="product-edit-overlay"></div>

    <div class="product-edit-container">

        <!-- MODAL HEADER -->

        <div class="product-edit-header">

            <div>

                <h2>Add New Vegetable</h2>

                <p>
                    Add a new vegetable to your FreshCart store
                </p>

            </div>

            <button
                type="button"
                id="closeProductAdd"
                class="product-edit-close"
            >
                ×
            </button>

        </div>


        <!-- FORM -->

        <form id="productAddForm">

            <!-- NAME -->

            <div class="product-edit-field">

                <label for="addProductName">
                    Vegetable Name
                </label>

                <input
                    type="text"
                    id="addProductName"
                    placeholder="Example: Fresh Green Peas"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="product-edit-field">

                <label for="addProductDescription">
                    Description
                </label>

                <textarea
                    id="addProductDescription"
                    rows="4"
                    placeholder="Enter vegetable description..."
                ></textarea>

            </div>


            <!-- ORIGIN -->

            <div class="product-edit-field">

                <label for="addProductOrigin">
                    Origin
                </label>

                <input
                    type="text"
                    id="addProductOrigin"
                    placeholder="Example: Ooty, Tamil Nadu"
                >

            </div>


            <!-- IMAGE -->

            <div class="product-edit-field">

                <label for="addProductImage">
                    Image URL
                </label>

                <input
                    type="url"
                    id="addProductImage"
                    placeholder="https://..."
                >

            </div>


          <!-- VARIANTS -->

<div class="product-edit-field">

    <label>
        Variants & Prices
    </label>

    <div
        id="addVariantsList"
        class="edit-variants-list"
    >
        <!-- Variants loaded dynamically -->
    </div>

    <button
        type="button"
        id="addNewVariantButton"
        class="add-variant-button"
    >
        + Add Variant
    </button>

</div>


<!-- STOCK MANAGEMENT -->

<div class="product-edit-field">

    <label>Stock Management</label>

    <div class="stock-edit-grid">

        <div class="stock-edit-input">
            <label for="addProductStock">
                Stock Quantity
            </label>

            <input
                type="number"
                id="addProductStock"
                min="0"
                step="1"
                placeholder="Enter quantity"
                required
            >
        </div>

        <div class="stock-edit-input">
            <label for="addProductStockUnit">
                Stock Unit
            </label>

            <select id="addProductStockUnit">
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="pcs">pcs</option>
                <option value="bunch">bunch</option>
                <option value="box">box</option>
                <option value="dozen">dozen</option>
            </select>
        </div>

        <div class="stock-edit-input">
            <label for="addLowStockThreshold">
                Low Stock Alert
            </label>

            <input
                type="number"
                id="addLowStockThreshold"
                min="0"
                step="1"
                placeholder="5"
                required
            >
        </div>

    </div>

</div>


<!-- ACTIONS -->





              
         

    <div class="product-edit-actions">

                <button
                    type="button"
                    id="cancelProductAdd"
                    class="product-cancel-button"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    id="createProductButton"
                    class="product-save-button"
                >
                    Create Vegetable
                </button>

            </div>

        </form>

    </div>

</div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="/src/admin-vegetables.js"
    ></script>

</body>

</html>
