<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Your Order - FreshCart</title>

    <link
        rel="stylesheet"
        href="/src/style.css"
    >

    <style>
        .tracking-page {
            min-height: 100vh;
            padding: 100px 20px 60px;
            background: #f7faf7;
        }

        .tracking-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .tracking-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .tracking-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .tracking-header p {
            color: #666;
        }

        .tracking-card {
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .order-id-box {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }

        .order-id-box span {
            display: block;
            color: #777;
            margin-bottom: 8px;
        }

        .order-id-box strong {
            font-size: 28px;
        }

        /* TRACKING */

        .tracking-timeline {
            margin: 40px 0;
        }

        .tracking-step {
            display: flex;
            gap: 20px;
            position: relative;
            padding-bottom: 35px;
        }

        .tracking-step:last-child {
            padding-bottom: 0;
        }

        .tracking-icon-wrapper {
            position: relative;
            z-index: 2;
        }

        .tracking-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8eee8;
            color: #777;
            font-size: 20px;
            font-weight: bold;
        }

        .tracking-step.completed .tracking-icon {
            background: #2e7d32;
            color: white;
        }

        .tracking-step.current .tracking-icon {
            background: #f59e0b;
            color: white;
        }

        .tracking-line {
            position: absolute;
            left: 23px;
            top: 48px;
            width: 2px;
            height: calc(100% - 48px);
            background: #ddd;
        }

        .tracking-step.completed .tracking-line {
            background: #2e7d32;
        }

        .tracking-content h3 {
            margin: 3px 0 6px;
            font-size: 18px;
        }

        .tracking-content p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* ORDER DETAILS */

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 35px;
        }

        .detail-box {
            padding: 20px;
            background: #f7faf7;
            border-radius: 14px;
        }

        .detail-box h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .detail-box p {
            margin: 5px 0;
            color: #555;
        }

        .items-section {
            margin-top: 35px;
        }

        .items-section h3 {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-info strong {
            display: block;
        }

        .item-info small {
            color: #777;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            font-size: 20px;
            font-weight: bold;
        }

        .tracking-loading,
        .tracking-error {
            text-align: center;
            padding: 50px 20px;
        }

        .tracking-error {
            color: #c62828;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .tracking-page {
                padding: 80px 15px 40px;
            }

            .tracking-card {
                padding: 22px;
            }

            .tracking-header h1 {
                font-size: 28px;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .tracking-content h3 {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="tracking-page">

        <div class="tracking-container">

            <div class="tracking-header">

                <h1>Track Your Order</h1>

                <p>
                    Follow your FreshCart order from confirmation
                    to delivery.
                </p>

            </div>

            <div
                id="trackingContent"
                class="tracking-card"
            >

                <div class="tracking-loading">
                    <h2>Loading your order...</h2>
                    <p>Please wait.</p>
                </div>

            </div>

        </div>

    </main>

    <script type="module">

        import { supabase } from './src/services/supabase.js';

        const trackingContent =
            document.querySelector('#trackingContent');

        const params =
            new URLSearchParams(window.location.search);

        const orderId =
            params.get('orderId');
        
        const trackingToken =
            params.get('token');

        let currentOrder = null;
        let currentItems = [];
        let trackingInterval = null;

        if (!orderId) {

    showError(
        'No order ID was provided.'
    );

} else if (!trackingToken) {

    showError(
        'Invalid tracking link.'
    );

} else {

    loadOrder();

    // Check for order status changes every 5 seconds
    trackingInterval = setInterval(
        loadOrder,
        5000
    );

}


        async function loadOrder() {

    try {

        if (!trackingToken) {
            throw new Error(
                'Invalid tracking link.'
            );
        }

        const {
            data,
            error
        } = await supabase.rpc(
            'get_order_tracking',
            {
                p_tracking_token: trackingToken
            }
        );

        if (error) {
            throw error;
        }

        if (!data || !data.order) {
            throw new Error(
                'Order not found.'
            );
        }

        currentOrder = data.order;
        currentItems = data.items || [];

        renderOrder(
            currentOrder,
            currentItems
        );

        console.log(
            'FreshCart: Order tracking loaded',
            currentOrder.order_status
        );

    } catch (error) {

        console.error(
            'FreshCart: Failed to load order',
            error
        );

        showError(
            'Unable to load this order. Please check your tracking link.'
        );
    }
}


   


        function renderOrder(order, items) {

            const status =
                order.order_status || 'placed';


            const statuses = [
                {
                    key: 'placed',
                    title: 'Order Placed',
                    description:
                        'Your order has been received.'
                },
                {
                    key: 'confirmed',
                    title: 'Order Confirmed',
                    description:
                        'Your order has been confirmed.'
                },
                {
                    key: 'packed',
                    title: 'Packed',
                    description:
                        'Your fresh products are packed.'
                },
                {
                    key: 'out_for_delivery',
                    title: 'Out for Delivery',
                    description:
                        'Your order is on the way.'
                },
                {
                    key: 'delivered',
                    title: 'Delivered',
                    description:
                        'Your order has been delivered.'
                }
            ];


            const currentIndex =
                statuses.findIndex(
                    item => item.key === status
                );


            const timelineHTML =
                statuses.map(
                    (item, index) => {

                        let className =
                            'tracking-step';


                        if (
                            index < currentIndex
                        ) {
                            className +=
                                ' completed';
                        }


                        if (
                            index === currentIndex
                        ) {
                            className +=
                                ' current';
                        }


                        const icon =
                            index <= currentIndex
                                ? '✓'
                                : '○';


                        return `

                            <div
                                class="${className}"
                            >

                                <div class="tracking-icon-wrapper">

                                    <div class="tracking-icon">
                                        ${icon}
                                    </div>

                                </div>

                                ${
                                    index <
                                    statuses.length - 1
                                        ? `
                                            <div
                                                class="tracking-line"
                                            ></div>
                                        `
                                        : ''
                                }

                                <div class="tracking-content">

                                    <h3>
                                        ${item.title}
                                    </h3>

                                    <p>
                                        ${item.description}
                                    </p>

                                </div>

                            </div>

                        `;
                    }
                ).join('');


            const itemsHTML =
                items.map(
                    item => `

                        <div class="order-item">

                            <div class="item-info">

                                <strong>
                                    ${escapeHTML(
                                        item.product_name
                                    )}
                                </strong>

                                <small>
                                    ${escapeHTML(
                                        item.variant_name
                                    )}
                                    × ${item.quantity}
                                </small>

                            </div>

                            <strong>
                                ${formatPrice(
                                    item.total_price
                                )}
                            </strong>

                        </div>

                    `
                ).join('');


            trackingContent.innerHTML = `

                <div class="order-id-box">

                    <span>
                        Order ID
                    </span>

                    <strong>
                        #${order.id}
                    </strong>

                </div>


                <div class="tracking-timeline">

                    ${timelineHTML}

                </div>


                <div class="order-details">

                    <div class="detail-box">

                        <h3>
                            Delivery Details
                        </h3>

                        <p>
                            <strong>
                                ${escapeHTML(
                                    order.customer_name
                                )}
                            </strong>
                        </p>

                        <p>
                            ${escapeHTML(
                                order.customer_phone
                            )}
                        </p>

                        <p>
                            ${escapeHTML(
                                order.address
                            )}
                        </p>

                        <p>
                            ${escapeHTML(
                                order.city
                            )} -
                            ${escapeHTML(
                                order.pincode
                            )}
                        </p>

                    </div>


                    <div class="detail-box">

                        <h3>
                            Payment
                        </h3>

                        <p>
                            Method:
                            ${escapeHTML(
                                order.payment_method
                            )}
                        </p>

                        <p>
                            Status:
                            ${escapeHTML(
                                order.payment_status
                            )}
                        </p>

                        <p>
                            Order Status:
                            ${escapeHTML(
                                order.order_status
                            )}
                        </p>

                    </div>

                </div>


                <div class="items-section">

                    <h3>
                        Order Items
                    </h3>

                    ${itemsHTML}


                    <div class="order-total">

                        <span>
                            Total
                        </span>

                        <strong>
                            ${formatPrice(
                                order.total_amount
                            )}
                        </strong>

                    </div>

                </div>


                <div style="text-align:center">

                    <a
                        href="/"
                        class="back-home"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;
        }


        function showError(message) {

            trackingContent.innerHTML = `

                <div class="tracking-error">

                    <h2>
                        ${message}
                    </h2>

                    <a
                        href="/"
                        class="back-home"
                    >
                        Back to FreshCart
                    </a>

                </div>

            `;
        }


        function formatPrice(price) {

            return `₹${Number(price)
                .toLocaleString('en-IN')}`;

        }


        function escapeHTML(value) {

            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');

        }

    </script>

</body>
</html>
